<html lang="ko">
<head>

<style>:root{--bg:#070B16;--surface:#101A2E;--surface-2:#16223C;--blue:#0064FF;--blue-light:#4EA1FF;--text:#F2F6FF;--text-muted:#8CA0C6;--border:#1E2B47}*{box-sizing:border-box}html,body{margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;padding-bottom:60px}header{padding:48px 24px 28px;text-align:center;border-bottom:1px solid var(--border)}.eyebrow{display:inline-block;font-family:'Space Grotesk',sans-serif;font-size:12px;letter-spacing:0.14em;color:var(--blue-light);background:rgba(0,100,255,0.12);border:1px solid rgba(78,161,255,0.4);padding:5px 12px;border-radius:999px;margin-bottom:14px}h1{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:clamp(26px,5vw,42px);margin:0 0 8px;letter-spacing:-0.01em}header p{color:var(--text-muted);margin:0;font-size:13px}.install-btn{margin-top:16px;display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--border);color:var(--text);font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:13px;padding:9px 16px;border-radius:10px;cursor:pointer}.install-btn:hover{border-color:var(--blue-light)}.install-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.6);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}.install-overlay.open{display:flex}.install-modal{background:var(--surface);border:1px solid var(--border);border-radius:18px;width:100%;max-width:380px;padding:26px}.install-modal h3{font-family:'Space Grotesk',sans-serif;margin:0 0 16px;font-size:18px}.install-modal ol{margin:0 0 20px;padding-left:20px;color:var(--text);font-size:14px;line-height:1.9}.install-modal ol li{margin-bottom:4px}.install-close-btn{width:100%;padding:12px;border-radius:10px;border:none;background:var(--blue);color:#fff;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:14px;cursor:pointer}.tutorial-modal{max-width:340px}.tutorial-sub{color:var(--text-muted);font-size:13px;margin:-8px 0 18px}.tutorial-demo{background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:18px;overflow:hidden;position:relative;height:168px}.demo-toolbar{display:flex;justify-content:flex-end;position:relative}.demo-select{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:6px 10px;font-size:11px;font-weight:700;color:var(--text);font-family:'Space Grotesk',sans-serif;position:relative}.demo-cursor{position:absolute;right:-6px;top:18px;font-size:16px;animation:cursorMove 4s ease-in-out infinite}.demo-dropdown{position:absolute;top:30px;right:0;width:120px;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:4px;opacity:0;transform:translateY(-6px);pointer-events:none;animation:dropdownShow 4s ease-in-out infinite}.demo-option{font-size:10px;padding:5px 6px;border-radius:5px;color:var(--text-muted)}.demo-option.highlight{animation:optionHighlight 4s ease-in-out infinite}.demo-cards{display:flex;gap:8px;margin-top:40px;align-items:flex-end;height:70px}.demo-card{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:8px;height:60px;display:flex;align-items:flex-start;justify-content:center;padding-top:6px}.demo-badge{background:var(--blue);color:#fff;font-size:10px;font-weight:700;padding:2px 6px;border-radius:5px;font-family:'Space Grotesk',sans-serif}.demo-card.c1{animation:reorder1 4s ease-in-out infinite}.demo-card.c2{animation:reorder2 4s ease-in-out infinite}.demo-card.c3{animation:reorder3 4s ease-in-out infinite}@keyframes cursorMove{0%,15%{transform:translate(0,0)}30%,55%{transform:translate(-14px,6px)}70%,100%{transform:translate(0,0)}}@keyframes dropdownShow{0%,25%{opacity:0;transform:translateY(-6px)}35%,65%{opacity:1;transform:translateY(0)}75%,100%{opacity:0;transform:translateY(-6px)}}@keyframes optionHighlight{0%,40%{background:transparent;color:var(--text-muted)}50%,65%{background:var(--blue);color:#fff}75%,100%{background:transparent;color:var(--text-muted)}}@keyframes reorder1{0%,60%{order:1}75%,100%{order:2}}@keyframes reorder2{0%,60%{order:2}75%,100%{order:1}}@keyframes reorder3{0%,100%{order:3}}.grid{max-width:1100px;margin:40px auto 0;padding:0 24px;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:20px}.card{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:16px;overflow:hidden;transition:transform .18s ease,border-color .18s ease;display:flex;flex-direction:column}.card:hover{transform:translateY(-4px);border-color:rgba(78,161,255,0.5)}.card a.photo-link{display:block;position:relative;aspect-ratio:1 / 1;background:var(--surface-2);overflow:hidden}.card img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .25s ease}.card a.photo-link:hover img{transform:scale(1.05)}.ribbon{position:absolute;top:12px;left:-34px;background:var(--blue);color:#fff;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:12px;padding:4px 40px;transform:rotate(-38deg);box-shadow:0 2px 6px rgba(0,0,0,0.35);white-space:nowrap}.ribbon-right{position:absolute;top:12px;right:-34px;left:auto;background:#E5342B;color:#fff;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:11px;padding:4px 34px;transform:rotate(38deg);box-shadow:0 2px 6px rgba(0,0,0,0.35);white-space:nowrap}.card-body{padding:14px 14px 16px;display:flex;flex-direction:column;gap:10px;flex:1}.card-title{font-size:14px;font-weight:500;line-height:1.4;color:var(--text);min-height:38px}.price-row{display:flex;align-items:baseline;gap:8px}.discount-tag{color:var(--blue-light);font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:14px}.unit-price-tag{display:inline-block;align-self:flex-start;background:var(--surface-2);color:var(--text-muted);font-size:11px;padding:3px 8px;border-radius:6px;border:1px solid var(--border)}.category-tabs{max-width:1100px;margin:18px auto 0;padding:0 24px;display:flex;gap:8px;flex-wrap:wrap;justify-content:center}.category-tab{background:var(--surface);border:1px solid var(--border);color:var(--text-muted);font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:12px;padding:7px 14px;border-radius:999px;cursor:pointer}.category-tab.active{background:var(--blue);color:#fff;border-color:var(--blue)}.category-badge{display:inline-block;align-self:flex-start;background:rgba(78,161,255,0.12);color:var(--blue-light);font-size:11px;font-weight:700;padding:3px 8px;border-radius:6px}.flash-countdown{color:#FF7A45;font-size:12px;font-weight:700}.card.sold-out{opacity:0.55}.card.sold-out .card img{filter:grayscale(1)}.ribbon-soldout{background:#4B5568 !important}.soldout-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0.45);color:#fff;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:18px;letter-spacing:0.05em}.go-btn-disabled{background:var(--surface-2);color:var(--text-muted);cursor:not-allowed}.photo-link{cursor:pointer}span.photo-link{cursor:default}.price{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:15px;color:var(--text)}.go-btn{margin-top:auto;display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--blue);color:#fff;text-decoration:none;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:13px;padding:10px 12px;border-radius:10px;transition:filter .15s ease}.go-btn:hover{filter:brightness(1.12)}.empty{max-width:480px;margin:60px auto;text-align:center;color:var(--text-muted);padding:0 24px}.empty h2{font-family:'Space Grotesk',sans-serif;color:var(--text);font-size:20px;margin-bottom:8px}footer{text-align:center;color:var(--text-muted);font-size:11px;margin-top:50px;padding:0 24px}.toolbar{max-width:1100px;margin:26px auto 0;padding:0 24px;display:flex;justify-content:flex-end}.sort-tabs{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;width:100%}.sort-tab{background:var(--surface);border:1px solid var(--border);color:var(--text-muted);font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:12px;padding:9px 14px;border-radius:999px;cursor:pointer}.sort-tab.active{background:var(--blue);color:#fff;border-color:var(--blue)}.sort-tab:hover{border-color:var(--blue-light)}@media (max-width:480px){header{padding:36px 16px 22px}.toolbar{justify-content:center;padding:0 16px}.category-tabs{padding:0 16px}.grid{padding:0 16px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}}</style>

<body>

<header>
  <span class="eyebrow">{{OG_BADGE}}</span>
  <h1>{{OG_TITLE}}</h1>
  <p>{{OG_DESC}}</p>
  <button id="installBtn" class="install-btn">🖥 바탕화면에 추가</button>
</header>

<div class="toolbar">
  <div class="sort-tabs" id="sortTabs">
    <button class="sort-tab active" data-sort="latest">최신 등록순</button>
    <button class="sort-tab" data-sort="discount">할인율 높은순</button>
    <button class="sort-tab" data-sort="priceLow">가격 낮은순</button>
    <button class="sort-tab" data-sort="priceHigh">가격 높은순</button>
  </div>
</div>

<div class="category-tabs" id="categoryTabs"></div>

<div id="grid" class="grid"></div>
<div id="emptyState" class="empty" style="display:none;">
  <h2>오늘 등록된 특가가 아직 없어요</h2>
  <p>곧 새로운 특가가 올라올 예정이에요.</p>
</div>

<footer>매일 자정 기준으로 새 특가로 갱신돼요</footer>

<div class="install-overlay" id="installOverlay">
  <div class="install-modal">
    <h3 id="installModalTitle">바탕화면에 추가하기</h3>
    <ol id="installSteps"></ol>
    <button class="install-close-btn" onclick="closeInstallGuide()">확인했어요</button>
  </div>
</div>

<div class="install-overlay" id="tutorialOverlay">
  <div class="install-modal tutorial-modal">
    <h3>정렬 기능 사용법</h3>
    <p class="tutorial-sub">오른쪽 위 정렬 버튼으로 원하는 순서대로 볼 수 있어요</p>
    <div class="tutorial-demo">
      <div class="demo-toolbar">
        <div class="demo-select">
          <span class="demo-select-label">최신 등록순</span>
          <span class="demo-cursor">👆</span>
        </div>
        <div class="demo-dropdown">
          <div class="demo-option">최신 등록순</div>
          <div class="demo-option highlight">할인율 높은순</div>
          <div class="demo-option">가격 낮은순</div>
          <div class="demo-option">가격 높은순</div>
        </div>
      </div>
      <div class="demo-cards">
        <div class="demo-card c1"><span class="demo-badge">30%</span></div>
        <div class="demo-card c2"><span class="demo-badge">82%</span></div>
        <div class="demo-card c3"><span class="demo-badge">55%</span></div>
      </div>
    </div>
    <button class="install-close-btn" onclick="closeTutorial()">확인했어요</button>
  </div>
</div>
